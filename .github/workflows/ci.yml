name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE_RUN_ID: ci_${{ github.run_id }}_${{ github.run_attempt }}_verify
      TEST_DATABASE_DESTRUCTIVE_CLEANUP: enabled
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seogeo_test_run_ci_${{ github.run_id }}_${{ github.run_attempt }}_verify
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Create isolated test database
        env:
          PGPASSWORD: postgres
        run: createdb --host=127.0.0.1 --username=postgres "seogeo_test_run_${TEST_DATABASE_RUN_ID}"
      - name: Validate Prisma
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        shell: bash
        run: |
          set +e
          npm test > /tmp/vitest.log 2>&1
          test_exit=$?
          set -e
          if [ "$test_exit" -ne 0 ]; then
            echo "--- concise Vitest failure summary ---"
            grep -n -E 'FAIL|Failed Tests|AssertionError|Error:|tests/(integration|unit)/' /tmp/vitest.log | tail -n 180 || true
            echo "--- final Vitest output ---"
            tail -n 140 /tmp/vitest.log
            exit "$test_exit"
          fi
          tail -n 30 /tmp/vitest.log
      - name: Build
        run: npm run build

  production-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deployable runtime dependencies only
        run: npm install --omit=dev --legacy-peer-deps
      - name: Verify Prisma CLI is not in runtime tree
        run: |
          if [ -d node_modules/prisma ]; then
            echo "Prisma CLI must not be present in the runtime dependency tree"
            exit 1
          fi
      - name: Audit deployable runtime dependency tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/npm-audit-registry-proxy.mjs &
          audit_proxy_pid=$!
          trap 'kill "$audit_proxy_pid" 2>/dev/null || true' EXIT
          for _ in {1..50}; do
            if curl --fail --silent http://127.0.0.1:8099/__health >/dev/null; then
              break
            fi
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:8099/__health >/dev/null
          npm audit --omit=dev --audit-level=high --legacy-peer-deps --registry=http://127.0.0.1:8099

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE_RUN_ID: ci_${{ github.run_id }}_${{ github.run_attempt }}_e2e
      TEST_DATABASE_DESTRUCTIVE_CLEANUP: enabled
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seogeo_test_run_ci_${{ github.run_id }}_${{ github.run_attempt }}_e2e
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: ci-test-secret
      CRAWLER_BROWSER_ENABLED: 'false'
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Create isolated test database
        env:
          PGPASSWORD: postgres
        run: createdb --host=127.0.0.1 --username=postgres "seogeo_test_run_${TEST_DATABASE_RUN_ID}"
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Install Chromium system dependencies
        timeout-minutes: 10
        run: |
          sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          node node_modules/@playwright/test/cli.js install-deps chromium
      - name: Install Chromium browser
        timeout-minutes: 10
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Browser smoke tests
        timeout-minutes: 5
        run: npm run test:e2e
      - name: Upload P10 dashboard screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-dashboard-screenshot
          path: p10-dashboard.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload P10 UI-03 analysis screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-ui-03-analysis-screenshots
          path: |
            p10-ui-03-seo.png
            p10-ui-03-visibility.png
            p10-ui-03-ai.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload P10 UI-05 admin screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-ui-05-admin-screenshots
          path: |
            p10-ui-05-members.png
            p10-ui-05-settings.png
            p10-ui-05-optimization.png
          if-no-files-found: error
          retention-days: 7

  deployment-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARTIFACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ARTIFACT_SHA }}
      - name: Verify exact artifact source SHA
        run: test "$(git rev-parse HEAD)" = "$ARTIFACT_SHA"
      - name: Build runtime image
        run: docker build --target runtime -t "seogeo:$ARTIFACT_SHA" .
      - name: Build migration image
        run: docker build --target migration -t "seogeo-migration:$ARTIFACT_SHA" .
      - name: Verify runtime artifact contents without network
        run: |
          docker run --rm --network none --entrypoint sh "seogeo:$ARTIFACT_SHA" -lc '
            test -f dist/src/server.js
            test -f dist/src/worker.js
            node -e "const p=require(\"./package.json\"); if (p.scripts.start !== \"node dist/src/server.js\") process.exit(1); if (p.scripts[\"start:worker\"] !== \"exec node dist/src/worker.js\") process.exit(1)"
          '
      - name: Verify Prisma CLI is absent from runtime image
        run: |
          docker run --rm --network none --entrypoint sh "seogeo:$ARTIFACT_SHA" -lc '
            test ! -d node_modules/prisma
          '
